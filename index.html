html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:15px;-webkit-font-smoothing:antialiased;overscroll-behavior:none;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font-family:var(--font);color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font-family:var(--font);font-size:16px}

/* ── ambient light behind the glass ── */
#bgfx{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none;
  background:radial-gradient(120% 80% at 50% -10%,#1c1b3a 0%,#12121f 45%,#0b0d16 100%)}
#bgfx i{position:absolute;display:block;border-radius:50%;filter:blur(60px);opacity:.55;
  will-change:transform}
#bgfx i:nth-child(1){width:60vw;height:60vw;left:-18vw;top:-8vh;background:#5b45c9;animation:drift1 34s ease-in-out infinite}
#bgfx i:nth-child(2){width:52vw;height:52vw;right:-16vw;top:22vh;background:#2f6ea8;opacity:.4;animation:drift2 44s ease-in-out infinite}
#bgfx i:nth-child(3){width:64vw;height:64vw;left:6vw;bottom:-22vh;background:#7d3f9c;opacity:.32;animation:drift3 52s ease-in-out infinite}
#bgfx b{position:absolute;inset:0;display:block;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.13) .5px,transparent .5px);background-size:3px 3px}
@keyframes drift1{50%{transform:translate3d(8vw,7vh,0) scale(1.12)}}
@keyframes drift2{50%{transform:translate3d(-9vw,-6vh,0) scale(1.14)}}
@keyframes drift3{50%{transform:translate3d(6vw,-8vh,0) scale(.9)}}
@media (prefers-reduced-motion:reduce){#bgfx i{animation:none}}

#scroll{position:fixed;inset:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top) + 14px) 0 calc(112px + env(safe-area-inset-bottom))}
.wrap{padding:0 18px}
.h1{font-size:27px;font-weight:650;letter-spacing:-.03em;line-height:1.15;white-space:nowrap}
#app{max-width:430px;margin:0 auto}
.sub{margin-top:5px;font-size:13px;color:var(--n500)}
.kick{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:650;color:var(--n500)}

/* ── glass surfaces ── */
.card,.tint,.row,.glass{position:relative;border-radius:var(--rl)}
.card,.glass{background:linear-gradient(158deg,rgba(255,255,255,.085),rgba(255,255,255,.045) 46%,rgba(255,255,255,.03));
  box-shadow:var(--sheen),inset 0 0 0 1px var(--edge),var(--lift)}
.tint{background:linear-gradient(150deg,rgba(150,132,255,.28),rgba(90,80,190,.10) 62%,rgba(255,255,255,.04));
  box-shadow:var(--sheen),inset 0 0 0 1px rgba(178,164,255,.26),var(--lift)}
.card::after,.tint::after,.glass::after{content:'';position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;background:linear-gradient(158deg,rgba(255,255,255,.13),rgba(255,255,255,.02) 34%,transparent 62%)}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;
  background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.04));
  box-shadow:var(--sheen),inset 0 0 0 1px var(--edge)}
.row.done{background:rgba(255,255,255,.028);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.row.hold{background:rgba(255,178,107,.06);box-shadow:inset 0 0 0 1px rgba(255,178,107,.20)}

.check{flex:none;width:31px;height:31px;border-radius:50%;background:rgba(255,255,255,.05);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.20),inset 0 1px 0 rgba(255,255,255,.18)}
.check.on{background:linear-gradient(150deg,#c3b6ff,#8b7bf0);display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px -4px rgba(150,132,255,.9),inset 0 1px 0 rgba(255,255,255,.5);
  animation:pop .3s cubic-bezier(.22,1,.36,1)}
.check.on i{font-size:16px;color:#1b1830}
.nm{font-size:14px;font-weight:520;letter-spacing:-.01em}
.nm.done{color:var(--n600);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.22);font-weight:400}
.meta{margin-top:3px;font-size:11.5px;color:#7c8096;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--a200);
  box-shadow:inset 0 0 0 1px var(--edge),inset 0 1px 0 rgba(255,255,255,.14);
  font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums}
.flame{flex:none;display:flex;align-items:center;gap:3px;font-size:11.5px;color:var(--n600);
  font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 13px;border-radius:999px;
  font-size:12.5px;background:rgba(255,255,255,.05);color:var(--n400);border:0;
  box-shadow:inset 0 0 0 1px var(--edge),inset 0 1px 0 rgba(255,255,255,.10);transition:.16s}
.chip.on{background:linear-gradient(150deg,rgba(169,155,255,.42),rgba(120,104,220,.24));color:#fff;
  box-shadow:inset 0 0 0 1px rgba(190,178,255,.5),inset 0 1px 0 rgba(255,255,255,.3),0 4px 14px -6px rgba(150,132,255,.8)}
.sec{width:100%;display:flex;align-items:center;gap:9px;padding:0 0 11px}
.sec .ln{flex:1;height:1px;background:linear-gradient(to right,var(--line2),transparent)}
.list{display:flex;flex-direction:column;gap:8px}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:14px;
  border-radius:var(--r);border:0;font-size:15px;font-weight:650;letter-spacing:-.01em;color:#15121f;
  background:linear-gradient(150deg,#cfc5ff,#9d8dfa);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 26px -12px rgba(150,132,255,.95)}
.btn.ghost{background:none;box-shadow:none;color:var(--n600);font-weight:600}
.btn.sec2{background:rgba(255,255,255,.06);color:var(--text);
  box-shadow:inset 0 0 0 1px var(--edge),inset 0 1px 0 rgba(255,255,255,.12)}

.tabs{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:406px;
  bottom:calc(10px + env(safe-area-inset-bottom));border-radius:22px;overflow:hidden;
  background:rgba(24,25,42,.62);-webkit-backdrop-filter:saturate(180%) blur(26px);backdrop-filter:saturate(180%) blur(26px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(255,255,255,.10),0 18px 40px -14px rgba(0,0,0,.9);
  display:grid;grid-template-columns:repeat(5,1fr);z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 0 10px;color:#7c8096;font-size:9.5px;
  position:relative}
.tab.on{color:#fff}
.tab.on::before{content:'';position:absolute;inset:5px 8px;border-radius:15px;
  background:linear-gradient(160deg,rgba(169,155,255,.32),rgba(255,255,255,.05));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
.tab i,.tab span{position:relative}
.tab i{font-size:21px}

.sheet{position:fixed;inset:0;background:rgba(6,7,14,.5);
  -webkit-backdrop-filter:saturate(160%) blur(20px);backdrop-filter:saturate(160%) blur(20px);
  z-index:20;display:flex;align-items:flex-end}
.sheet>div{width:100%;max-width:430px;margin:0 auto;max-height:93%;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  background:linear-gradient(180deg,rgba(38,39,64,.97),rgba(24,25,42,.97));
  border-radius:var(--rxl) var(--rxl) 0 0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,255,255,.08),0 -20px 60px rgba(0,0,0,.6)}
.sheet>div.in{animation:up .34s cubic-bezier(.22,1,.36,1)}
.full{position:fixed;inset:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:25;
  background:linear-gradient(180deg,rgba(32,32,56,.985),rgba(16,17,29,.985));
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);
  padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.full.in{animation:up .3s cubic-bezier(.22,1,.36,1)}
.toast{position:fixed;left:20px;right:20px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:30;
  padding:14px 15px;border-radius:var(--rl);background:rgba(48,44,84,.8);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 1px rgba(255,255,255,.12),0 16px 40px rgba(0,0,0,.6);
  display:flex;align-items:center;gap:10px;font-size:13px;animation:up .26s cubic-bezier(.22,1,.36,1)}
.field label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--n600);margin-bottom:6px}
.inp{width:100%;font-size:16px;padding:12px 13px;border-radius:var(--r);background:var(--sunk);border:0;
  box-shadow:inset 0 0 0 1px var(--edge);color:var(--text)}
.inp:focus{outline:0;box-shadow:inset 0 0 0 1.5px var(--accent)}
.tinp{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;padding:11px 8px;border-radius:var(--r);
  background:var(--sunk);border:0;box-shadow:inset 0 0 0 1px var(--edge);color:var(--text);
  width:100%;text-align:center;-webkit-appearance:none;appearance:none;min-height:44px}
.tinp:focus{outline:0;box-shadow:inset 0 0 0 1.5px var(--accent)}
.tinp::-webkit-date-and-time-value{text-align:center}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);border-radius:var(--rl);overflow:hidden;
  background:linear-gradient(158deg,rgba(255,255,255,.085),rgba(255,255,255,.035));
  box-shadow:var(--sheen),inset 0 0 0 1px var(--edge),var(--lift)}
.grid4>div{padding:14px 4px;text-align:center;box-shadow:inset -1px 0 0 var(--line)}
.grid4>div:last-child{box-shadow:none}
.big{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cap{margin-top:3px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--n600)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal button{aspect-ratio:1;border-radius:12px;font-size:12.5px;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;justify-content:center;border:1px solid transparent}
.bar{height:5px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#8b7bf0,#cfc5ff)}
.divrow{display:flex;align-items:center;gap:11px;padding:13px 15px;box-shadow:inset 0 -1px 0 var(--line);
  width:100%;text-align:left;position:relative}
.sw{flex:none;width:46px;height:28px;border-radius:999px;padding:2px;display:flex;background:rgba(255,255,255,.10);
  box-shadow:inset 0 0 0 1px var(--edge);justify-content:flex-start;transition:.2s cubic-bezier(.22,1,.36,1)}
.sw.on{background:linear-gradient(150deg,#b0a2ff,#7f6fdb);justify-content:flex-end;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 12px -4px rgba(150,132,255,.9)}
.sw i{display:block;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}

/* ── sleep timeline ── */
.tl{position:relative;height:30px;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.05);
  box-shadow:inset 0 0 0 1px var(--edge)}
.tl u{position:absolute;top:0;bottom:0;display:block}
.tl u.w{background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,.08))}
.tl u.d{background:linear-gradient(180deg,rgba(255,178,107,.5),rgba(255,178,107,.22))}
.tl u.s{background:linear-gradient(180deg,rgba(169,155,255,.62),rgba(120,104,220,.34))}
.tl b{position:absolute;top:50%;transform:translateY(-50%);font-size:9.5px;font-weight:650;
  letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.82);padding:0 7px}
@keyframes pop{0%{transform:scale(.82);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>

var PRESET=[['early','Early',6*60+30,15*60],['long','Long day',8*60+45,18*60+15],
            ['late','Late',14*60,24*60],['close','Close',16*60,25*60]];
var DEFAULT_WEEK={0:'off',1:'off',2:'long',3:'off',4:'off',5:'long',6:'off'};

function normDay(v){
  if(v==null||v==='off')return{off:true};
  if(typeof v==='string'){
    for(var i=0;i<PRESET.length;i++)if(PRESET[i][0]===v)return{off:false,s:PRESET[i][2],e:PRESET[i][3]};
    return{off:true};}
  if(typeof v==='object'&&typeof v.s==='number'&&typeof v.e==='number'){
    var e=v.e;if(e<=v.s)e+=1440;return{off:false,s:v.s,e:e};}
  return{off:true};
}
function dayAt(d){return normDay(weekDays(wid(d))[midx(d)])}
function hhmm(m){m=Math.round(m);var x=((m%1440)+1440)%1440;return pad(Math.floor(x/60))+':'+pad(x%60)}
function tmin(t){return parseInt(t.slice(0,2),10)*60+parseInt(t.slice(3,5),10)}
function hm(m){m=Math.max(0,Math.round(m));var h=Math.floor(m/60),n=m%60;
  return h?(h+'h'+(n?' '+n+'m':'')):(n+'m')}
function winOf(x){return x.off?'\u2014':hhmm(x.s)+' \u2013 '+hhmm(x.e)}
function labOf(x){return x.off?'Day off':'Shift '+hm(x.e-x.s)}
function addDay(d,n){var q=new Date(d);q.setDate(q.getDate()+n);return q}

  wakeCap:570,lieIn:600,minSettle:15,minWind:15};
function cfg(){var c={},k;for(k in CFG)c[k]=CFG[k];if(S.cfg)for(k in S.cfg)if(typeof S.cfg[k]==='number')c[k]=S.cfg[k];return c}

var DUR={wake:1,water1:2,brushAM:4,bed:3,breakfast:20,suppsAM:3,
  prep:6,castor:4,brushPM:4,suppsPM:2,read:20,
  study:45,steps:35,money:4};
var AM=['wake','water1','brushAM','bed','breakfast','suppsAM'];
var PM=['prep','castor','brushPM','suppsPM','read'];
var DAYJOB=['study','steps','money'];
var TRIM_PM=['read','castor','prep'];
var TRIM_AM=['bed','suppsAM'];

/* the night that STARTS on date d: uses d\u2019s finish and (d+1)\u2019s start */
function nightFor(d){
  var c=cfg(),tdy=dayAt(d),tom=dayAt(addDay(d,1)),have={},skip={},dropped=[];
  habits().forEach(function(h){have[h.id]=1});
  function sum(ids){var t=0;ids.forEach(function(x){if(have[x]&&!skip[x])t+=(DUR[x]||0)});return t}

  var amLen=sum(AM),eveLen=sum(PM);
  var home = tdy.off ? c.offEve : tdy.e+c.commute;
  var settle = tdy.off ? 0 : c.settle;
  var wind = c.wind;

  /* the latest he can possibly get up \u2014 but never a wake time no human would keep */
  function latestWake(){
    if(tom.off)return 1440+c.offWake;
    return Math.min(1440+tom.s-c.commute-amLen-c.buf, 1440+c.wakeCap);
  }
  var wakeAbs=latestWake();
  var L = wakeAbs-c.latency-c.sleep;
  function floorAt(){return home+settle+Math.max(wind,eveLen)}
  var floorL=floorAt();

  /* not enough room between finishing and needing to be asleep \u2192 give things up */
  for(var t=0;t<TRIM_PM.length&&L<floorL;t++){
    var id=TRIM_PM[t]; if(!have[id]||skip[id])continue;
    skip[id]=1;dropped.push(id);eveLen=sum(PM);floorL=floorAt();
  }
  /* still short \u2192 shorten the decompress and the wind-down band */
  if(L<floorL&&settle>c.minSettle){settle=c.minSettle;floorL=floorAt()}
  if(L<floorL&&wind>c.minWind){wind=c.minWind;floorL=floorAt()}
  /* still short \u2192 trim the morning so he can stay in bed longer */
  for(var t2=0;t2<TRIM_AM.length&&L<floorL;t2++){
    var id2=TRIM_AM[t2]; if(!have[id2]||skip[id2])continue;
    skip[id2]=1;dropped.push(id2);amLen=sum(AM);
    wakeAbs=latestWake();L=wakeAbs-c.latency-c.sleep;
  }
  if(L<floorL)L=floorL;

  eveLen=sum(PM);
  var band=Math.max(wind,eveLen);
  var sleepMins=wakeAbs-c.latency-L;

  /* nothing on tomorrow \u2192 let him lie in rather than lose sleep */
  if(tom.off&&sleepMins<c.sleep){
    wakeAbs=Math.min(L+c.latency+c.sleep,1440+c.lieIn);
    sleepMins=wakeAbs-c.latency-L;
  }
  /* if he's in bed earlier than he needs to be, don't force him up early for nothing */
  if(!tom.off&&sleepMins>c.sleep+30){L=wakeAbs-c.latency-c.sleep;sleepMins=c.sleep}
  var turn = tdy.off||tom.off ? null : (1440+tom.s)-tdy.e;
  return {tdy:tdy,tom:tom,home:home,settle:settle,wind:wind,L:L,eveStart:L-band,eveLen:eveLen,band:band,
    amLen:amLen,wakeAbs:wakeAbs,sleep:sleepMins,skip:skip,dropped:dropped,
    tight:sleepMins<c.sleep-15,short:sleepMins<c.floor,turn:turn,
    squeezed:dropped.length>0||sleepMins<c.sleep-15};
}

/* the full timetable for date d */
function planFor(d){
  var key=dkey(d); if(planCache[key])return planCache[key];
  var c=cfg(),tdy=dayAt(d),last=nightFor(addDay(d,-1)),night=nightFor(d);
  var have={};habits().forEach(function(h){have[h.id]=1});
  var T={},drop=[],t;

  /* morning \u2014 set by last night\u2019s plan */
  var wake=last.wakeAbs-1440; t=wake;
  AM.forEach(function(id){ if(!have[id])return;
    if(last.skip[id]){drop.push(id);return}
    T[id]=hhmm(t); t+=DUR[id]||0; });
  var amEnd=t;
  last.dropped.forEach(function(id){if(AM.indexOf(id)>=0&&drop.indexOf(id)<0)drop.push(id)});

  /* evening \u2014 wind-down band ending at lights out */
  T.phone=hhmm(night.eveStart);
  t=night.L-night.eveLen;
  PM.forEach(function(id){ if(!have[id]||night.skip[id])return; T[id]=hhmm(t); t+=DUR[id]||0; });
  T.sleep=hhmm(night.L);
  night.dropped.forEach(function(id){if(PM.indexOf(id)>=0&&drop.indexOf(id)<0)drop.push(id)});

  /* the free windows left in the day */
  var gaps=[];
  if(tdy.off)gaps.push([amEnd+15,night.eveStart-10]);
  else{
    gaps.push([amEnd+5,tdy.s-c.commute-5]);
    gaps.push([tdy.e+c.commute+night.settle,night.eveStart-10]);
  }
  gaps=gaps.filter(function(g){return g[1]-g[0]>=10});

  DAYJOB.forEach(function(id){
    if(!have[id])return;
    var need=DUR[id]||10,put=null;
    for(var g=0;g<gaps.length;g++){ if(gaps[g][1]-gaps[g][0]>=need){put=gaps[g][0];gaps[g][0]+=need+10;break} }
    if(put===null)drop.push(id); else T[id]=hhmm(put);
  });

  if(have.water2)T.water2=hhmm(tdy.off?12*60:Math.min(tdy.s+Math.floor((tdy.e-tdy.s)/2),tdy.e-30));

  var P={d:key,sh:tdy,night:night,last:last,wake:wake,amEnd:amEnd,times:T,drop:drop,
    lightsOut:night.L,eveStart:night.eveStart,sleep:night.sleep,
    tight:night.tight,short:night.short,turn:night.turn,squeezed:night.squeezed,
    slept:last.sleep,quiet:hhmm(night.eveStart)+' \u2013 '+hhmm(night.wakeAbs)};
  planCache[key]=P;return P;
}

function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function midx(d){return (d.getDay()+6)%7}
function wid(d){var m=new Date(d);m.setDate(m.getDate()-midx(m));return dkey(m)}

function doneIds(){return S.log[today()]||[]}
function timeOf(h,P){if(P&&P.times[h.id])return P.times[h.id];if(h.flex)return 'flex';if(h.at)return h.at;return '18:00'}
function partOf(t){if(t==='flex')return 'flex';var h=parseInt(t.slice(0,2),10);
  if(h<4)return 'eve';if(h<12)return 'am';if(h<18)return 'pm';return 'eve'}

function hstreak(id){
  var start=(S.log[today()]||[]).indexOf(id)>=0?0:1,n=0;
  for(var i=start;i<400;i++){var d=new Date();d.setDate(d.getDate()-i);
    var l=S.log[dkey(d)];if(l&&l.indexOf(id)>=0)n++;else break}
  return n;
}

/* ─────────── derived ─────────── */
function compute(){
  var now=new Date(),hour=now.getHours(),P=planFor(now),sh=P.sh,done=doneIds();
  var allH=habits();
  var held=allH.filter(function(h){return P.drop.indexOf(h.id)>=0});
  var hs=allH.filter(function(h){return P.drop.indexOf(h.id)<0});
  var total=hs.length,dn=0,maxS=0,gotS=0;
  hs.forEach(function(h){maxS+=h.score;if(done.indexOf(h.id)>=0){dn++;gotS+=h.score}});
  var pct=total?Math.round(100*dn/total):0, score=maxS?Math.round(100*gotS/maxS):0;
  var streak=0;
  for(var i=0;i<400;i++){var d=new Date();d.setDate(d.getDate()-i);var p=pctFor(dkey(d),total);
    if(p===null)break; if(p>=60)streak++; else if(i>0)break;}
  var best=streak,run=0;
  for(var j=400;j>=0;j--){var d2=new Date();d2.setDate(d2.getDate()-j);var p2=pctFor(dkey(d2),total);
    if(p2!==null&&p2>=60){run++;if(run>best)best=run}else run=0;}
  var lifetime=0;for(var k in S.log)lifetime+=S.log[k].length;
  var yd=new Date();yd.setDate(yd.getDate()-1);
  var ydPct=pctFor(dkey(yd),total);
  var rows=hs.map(function(h){
    var t=timeOf(h,P),isDone=done.indexOf(h.id)>=0;
    var cnt=(S.counts[today()]||{})[h.id]||0;
    var tm=(S.timer&&S.timer.id===h.id)?timerLeft():null;
    var st=hstreak(h.id),name=h.name;
    if(h.id==='wake')name='Up by '+t+', no snooze';
    if(h.id==='sleep')name='Lights out by '+t;
    return {id:h.id,h:h,at:t,part:partOf(t),done:isDone,name:name,icon:h.icon,score:h.score,
      meta:isDone?'Done · +'+h.score:h.cue,streak:st,cnt:cnt,
      countLabel:cnt+' / '+h.target+' ml',
      timerLabel:tm!==null?pad(Math.floor(tm/60))+':'+pad(tm%60):'45:00'};
  }).sort(function(a,b){var A=a.at==='flex'?99999:mins(a.at),B=b.at==='flex'?99999:mins(b.at);return A-B});
  var cons=allH.map(function(h){
    var c=0;for(var i2=0;i2<30;i2++){var d3=new Date();d3.setDate(d3.getDate()-i2);
      if((S.log[dkey(d3)]||[]).indexOf(h.id)>=0)c++}
    return {id:h.id,name:h.name,icon:h.icon,p:Math.round(100*c/30)};
  }).sort(function(a,b){return b.p-a.p});
  return {now:now,hour:hour,P:P,sh:sh,held:held,hs:hs,done:done,total:total,dn:dn,pct:pct,score:score,
    streak:streak,best:best,lifetime:lifetime,ydPct:ydPct,rows:rows,cons:cons,
    fresh:lifetime===0,
    toUni:Math.max(0,Math.ceil((MOVE_IN-now)/86400000)),
    toLec:Math.max(0,Math.ceil((LECTURES-now)/86400000))};
}

function crunchLine(pl){
  var n=pl.night,c=cfg();
  var head=pl.turn!==null&&pl.turn<13*60
    ? 'Off at '+hhmm(pl.sh.e)+', back in at '+hhmm(n.tom.s)+' \u2014 '+hm(pl.turn)+' between shifts. '
    : '';
  var body;
  if(pl.short)body='Only '+hm(pl.sleep)+' fits. I\u2019ve cut everything I can'+
    (pl.drop.length?' ('+pl.drop.length+' habit'+(pl.drop.length>1?'s':'')+' off)':'')+
    ' \u2014 if you can move one of these two shifts, do.';
  else if(pl.drop.length)body=pl.drop.length+' habit'+(pl.drop.length>1?'s':'')+' held back so lights out still lands at '+
    hhmm(pl.lightsOut)+' for '+hm(pl.sleep)+'.';
  else body='Just under target at '+hm(pl.sleep)+'. Nothing dropped \u2014 just don\u2019t let the phone eat the wind-down.';
  return head+body;
}

function sleepCard(C){
  var P=C.P,N=P.night,c=cfg(),sh=P.sh,tom=N.tom;
  var L=P.lightsOut,W=N.wakeAbs,ES=P.eveStart;
  var t0=Math.min(ES-60,sh.off?ES-60:sh.s), t1=W+45;
  if(!sh.off)t0=Math.min(t0,sh.s-30);
  var span=Math.max(120,t1-t0);
  function pc(x){return Math.max(0,Math.min(100,100*(x-t0)/span))}
  var segs='';
  if(!sh.off)segs+='<u class="w" style="left:'+pc(sh.s)+'%;width:'+(pc(sh.e)-pc(sh.s))+'%"></u>';
  segs+='<u class="d" style="left:'+pc(ES)+'%;width:'+(pc(L)-pc(ES))+'%"></u>';
  segs+='<u class="s" style="left:'+pc(L)+'%;width:'+(pc(W)-pc(L))+'%"></u>';

  var tone=P.short?'#ffb26b':P.tight?'#ffd6a8':'#d5cfff';
  var head=hm(P.sleep);
  var why;
  if(sh.off&&tom.off)why='Nothing booked either side. Keep the times anyway \u2014 a rhythm you only hold on workdays isn\u2019t a rhythm.';
  else if(P.turn!==null&&P.turn<=11*60)
    why='You finish at '+hhmm(sh.e)+' and you\u2019re back in at '+hhmm(tom.s)+'. That\u2019s '+hm(P.turn)+
      ' door to door \u2014 I\u2019ve pulled the evening in to protect the sleep.';
  else if(!tom.off)why='In at '+hhmm(tom.s)+' tomorrow, so you\u2019re up at '+hhmm(N.wakeAbs)+'. Lights out at '+hhmm(L)+' makes the maths work.';
  else if(!sh.off)why='Nothing on tomorrow. Finish at '+hhmm(sh.e)+', wind down from '+hhmm(ES)+', and take the lie-in you\u2019ve earned.';
  else why='Free day either side \u2014 this is the easiest night of the week to hit the target.';
  if(P.short)why='Tight one. '+hm(c.floor)+' is my floor and you\u2019re near it \u2014 everything below is off tonight, and nothing else goes in.';

  return '<div class="card" style="margin-top:12px;padding:16px;overflow:hidden">'+
    '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">'+
      '<div><div class="kick" style="color:var(--a300)">Tonight\u2019s sleep</div>'+
      '<div style="margin-top:8px;display:flex;align-items:baseline;gap:8px">'+
        '<span style="font-size:34px;font-weight:650;letter-spacing:-.04em;color:'+tone+';font-variant-numeric:tabular-nums">'+head+'</span>'+
        (P.tight?'<span style="font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:'+tone+'">'+
          (P.short?'short':'under target')+'</span>':'')+'</div></div>'+
      '<div style="text-align:right;font-variant-numeric:tabular-nums">'+
        '<div style="font-size:11px;color:var(--n600)">Lights out</div>'+
        '<div style="font-size:17px;font-weight:650">'+hhmm(L)+'</div>'+
        '<div style="margin-top:6px;font-size:11px;color:var(--n600)">Up at</div>'+
        '<div style="font-size:17px;font-weight:650">'+hhmm(N.wakeAbs)+'</div></div></div>'+
    '<div class="tl" style="margin-top:14px">'+segs+
      (sh.off?'':'<b style="left:'+pc(sh.s)+'%">Shift</b>')+
      '<b style="left:'+pc(L)+'%">Sleep</b></div>'+
    '<div style="margin-top:9px;display:flex;gap:14px;font-size:10.5px;color:var(--n600);flex-wrap:wrap">'+
      (sh.off?'':'<span>Shift '+winOf(sh)+'</span>')+
      '<span>Phone down '+hhmm(ES)+'</span>'+
      '<span>'+(sh.off?'Evening free':'Home \u2248 '+hhmm(N.home))+'</span></div>'+
    '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line2);font-size:12.5px;'+
      'color:var(--n400);line-height:1.55">'+esc(why)+'</div>'+
    '<button data-act="plan:open" style="margin-top:12px;width:100%;padding:11px;border-radius:var(--r);'+
      'background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--edge);font-size:12.5px;font-weight:600;'+
      'color:var(--a200)">Change today\u2019s shift times</button>'+
    '</div>';
}

function heldCard(C){
  if(!C.held.length)return '';
  return '<div style="margin-top:24px">'+
    '<div class="sec"><i class="ph ph-moon" style="font-size:16px;color:var(--warn)"></i>'+
      '<span class="kick" style="color:var(--text)">Held back today</span><span class="ln"></span>'+
      '<span style="font-size:11.5px;color:var(--n600)">'+C.held.length+'</span></div>'+
    '<div style="margin-bottom:9px;font-size:12px;color:var(--n600);line-height:1.5">'+
      'Not a miss \u2014 a decision. These don\u2019t count against today.</div>'+
    '<div class="list">'+C.held.map(function(h){
      return '<div class="row hold"><i class="'+h.icon+'" style="font-size:16px;color:var(--warn);flex:none"></i>'+

        '<div class="meta">'+esc(WHY[h.id]||'Skipped to protect your sleep.')+'</div></div></div>';

}

  var timed=rows.filter(function(r){return r.at!=='flex'&&!r.done});
  var nowM=(C.hour<4?C.hour+24:C.hour)*60+now.getMinutes();
  var up=timed.filter(function(r){return mins(r.at)>=nowM});
  var over=timed.filter(function(r){return mins(r.at)<nowM});
  var next=up[0]||over[0]||null, isOver=!up.length&&!!over.length;
  var raw=C.hour*60+now.getMinutes();
  var onShiftNow=!sh.off&&raw>=sh.s&&raw<=Math.min(sh.e,1439);
  var nextLine=next?(isOver?'Overdue: '+next.name.toLowerCase()+', due '+next.at+'. Do the two-minute version now.'
    :'Next: '+next.name.toLowerCase()+' at '+next.at+(onShiftNow?' · on shift until '+hhmm(sh.e):''))
    :'Everything on today\u2019s list is done. Go and enjoy it.';

  var worst=C.cons[C.cons.length-1]||{name:'',p:0,id:''};
  var nT,nX,nI;
  if(C.fresh){nI='ph ph-flag-checkered';nT='Day one';
    nX='Nothing to live up to yet. Tick three things today — the easy ones — and you\u2019ve started a streak.';}
  else if(C.ydPct!==null&&C.ydPct<60){nI='ph ph-arrow-u-up-left';nT='Don\u2019t miss twice';
    nX='Yesterday finished at '+C.ydPct+'%. Clear the three cheapest habits in the next hour and today is back on.';}
  else if(C.pct<40&&C.hour>14){nI='ph ph-warning-circle';nT='You\u2019re behind';
    nX=C.dn+' of '+C.total+' done and it\u2019s '+pad(C.hour)+':00. Pick the two-minute versions and get the number moving.';}

    nX=worst.name+' is at '+worst.p+'% this month. '+(FIXES[worst.id]||'Shrink it until it happens.');}

  var R=640.9, off=R-R*C.pct/100;
  var stay=S.stay[today()]||null;
  var bring=stay?ITEMS.filter(function(it){return placeOf(it)!==stay}):[];

  '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">'+

    '<div style="text-align:right"><div style="font-size:20px;font-weight:600;font-variant-numeric:tabular-nums">'+

  '<div style="margin-top:16px;display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:var(--r);'+
    'background:var(--a900);box-shadow:0 0 0 1px var(--a800)">'+
    '<i class="ph ph-arrow-bend-down-right" style="font-size:15px;color:var(--a300);flex:none"></i>'+
    '<span style="font-size:12.5px;color:var(--a100);line-height:1.45">'+esc(nextLine)+'</span></div>'+

  sleepCard(C)+

  (needPlan?'<button data-act="plan:open" style="margin-top:12px;width:100%;text-align:left;padding:14px 15px;'+
    'border-radius:var(--rl);background:#221f36;box-shadow:0 0 0 1px var(--a700);display:flex;align-items:center;gap:12px">'+

      (planned(wid(now))?'Next week isn\u2019t confirmed yet.':'This week isn\u2019t confirmed. Give me your shifts.')+'</span>'+
    '<span style="display:block;margin-top:2px;font-size:12px;color:var(--n500);line-height:1.45">'+

    '<div><div style="font-size:13px;font-weight:600">'+nT+'</div>'+
    '<div style="margin-top:3px;font-size:12.5px;color:var(--n500);line-height:1.5">'+esc(nX)+'</div></div></div>'+

  '<div class="card" style="margin-top:10px;padding:14px">'+

    '<div style="font-size:11.5px;color:var(--n600)">'+(mood?'Logged':'One tap')+'</div></div>'+

      '<div style="font-size:10.5px;color:#6d7183;font-variant-numeric:tabular-nums">'+p+'%</div>'+
      '<div style="width:100%;height:'+Math.max(4,Math.round(p*0.62))+'px;border-radius:5px;background:'+

      '<div style="font-size:10.5px;color:var(--n600)">'+DOW[midx(d)]+'</div></div>';

function viewCal(C){
  var now=C.now,cur=new Date(now.getFullYear(),now.getMonth()+S.monthOff,1);
  var first=midx(cur),days=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();
  var cells='',sum=0,n=0;
  for(var i=0;i<first;i++)cells+='<span></span>';
  for(var d=1;d<=days;d++){
    var dt=new Date(cur.getFullYear(),cur.getMonth(),d),k=dkey(dt),isT=k===today();
    var p=isT?C.pct:pctFor(k,C.total);
    if(p!==null){sum+=p;n++}
    var future=dt>now&&!isT;
    var bg=(p===null||future)?'#191b25':p>=90?'#b5abfc':p>=60?'#796cbf':p>=30?'#423a6a':'#24262f';
    var fg=(p!==null&&p>=90)?'#1b1830':(p!==null&&p>=60)?'#e9e9ed':'#75798c';
    cells+='<button '+(future?'':'data-act="day:'+k+'"')+' style="background:'+bg+';color:'+fg+
      (isT?';border-color:var(--a300)':'')+(S.sel===k?';outline:2px solid var(--accent);outline-offset:1px':'')+
      (future?';opacity:.4':'')+'">'+d+'</button>';
  }
  var detail='';
  if(S.sel){
    var sd=new Date(S.sel+'T12:00'),lg=S.sel===today()?C.done:(S.log[S.sel]||[]);
    var mv=S.mood[S.sel]||0;
    detail='<div class="card" style="margin-top:18px;padding:16px">'+
      '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">'+
      '<div style="font-size:15px;font-weight:600">'+FULL[sd.getDay()]+' '+sd.getDate()+' '+MON[sd.getMonth()]+'</div>'+
      '<div style="font-size:13px;color:var(--a300)">'+lg.length+' of '+C.total+'</div></div>'+
      '<div style="margin-top:5px;font-size:12px;color:var(--n600)">'+(mv?'Mood: '+MOODS[mv-1][0].toLowerCase():'No mood logged')+'</div>'+
      '<div style="margin-top:12px;display:flex;flex-direction:column;gap:8px">'+C.hs.map(function(h){
        var ok=lg.indexOf(h.id)>=0;
        return '<div style="display:flex;align-items:center;gap:9px">'+
          '<i class="'+(ok?'ph-fill ph-check-circle':'ph ph-circle')+'" style="font-size:14px;color:'+(ok?'var(--a300)':'#3f424d')+'"></i>'+
          '<span style="font-size:12.5px;color:'+(ok?'var(--text)':'#5d6070')+'">'+esc(h.name)+'</span></div>';
      }).join('')+'</div></div>';
  } else detail='<div class="card" style="margin-top:18px;padding:20px 16px;text-align:center;font-size:12.5px;color:var(--n600)">'+
    'Tap any day to see what you finished.</div>';
  return '<div class="wrap">'+
    '<div style="display:flex;align-items:center;justify-content:space-between">'+
    '<div><div class="h1">'+MON[cur.getMonth()]+' '+cur.getFullYear()+'</div>'+
    '<div class="sub">'+(n?'Averaging '+Math.round(sum/n)+'% this month':'Nothing logged yet')+'</div></div>'+
    '<div style="display:flex;gap:8px">'+
    '<button data-act="cal:prev" style="width:38px;height:38px;border-radius:var(--r);box-shadow:0 0 0 1px var(--n800)">'+
      '<i class="ph ph-caret-left"></i></button>'+
    '<button data-act="cal:next" style="width:38px;height:38px;border-radius:var(--r);box-shadow:0 0 0 1px var(--n800)">'+
      '<i class="ph ph-caret-right"></i></button></div></div>'+
    '<div class="cal" style="margin-top:20px">'+DOW.map(function(l){
      return '<div style="text-align:center;font-size:10.5px;text-transform:uppercase;color:#6d7183">'+l+'</div>'}).join('')+
      cells+'</div>'+
    '<div style="margin-top:16px;display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--n600)">'+
    '<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#b5abfc"></i> 90–100%</span>'+
    '<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#796cbf"></i> 60–89%</span>'+
    '<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#423a6a"></i> 30–59%</span>'+
    '<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#24262f"></i> quiet day</span></div>'+
    detail+'</div>';
}

function libOn(active,nm){
  var n=nm.toLowerCase().replace(/\s*\(.*\)\s*$/,'');
  for(var i=0;i<active.length;i++){if(active[i]===n||active[i].indexOf(n)===0)return true}
  return false;
}

    var i=S.routine.i,cur=i<list.length?list[i]:null;
    var secs=Math.floor((Date.now()-S.routine.at)/1000);
    var dots=list.map(function(h,j){return '<div style="flex:1;height:3px;border-radius:999px;background:'+
      (j<i?'var(--accent)':j===i?'var(--a600)':'#2f3240')+'"></div>'}).join('');
    out+='<div class="full"><div style="padding:14px 20px 0;display:flex;align-items:center;justify-content:space-between">'+
      '<span style="font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--a300)">'+
        (S.routine.kind==='am'?'Morning':'Evening')+' routine</span>'+

  if(S.plan){

          (x.off?'':

            '<div style="flex:1"><div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;'+

              '<input class="tinp" type="time" step="300" id="se'+i+'" value="'+hhmm(x.e)+'"></div></div>')+

          '<div style="position:relative;margin-top:9px;display:flex;gap:5px;flex-wrap:wrap">'+
            PRESET.map(function(pr){
              var on=(!x.off&&x.s===pr[2]&&x.e===pr[3]);

            '<button class="chip" style="padding:7px 11px;font-size:11.5px" data-act="rest:'+i+'">'+
              '<i class="ph ph-arrow-bend-down-right"></i>Rest of week</button></div>'+

          '<div style="position:relative;margin-top:11px;font-size:11.5px;color:var(--n600);line-height:1.5;'+
            'font-variant-numeric:tabular-nums">'+esc(sumline)+'</div>'+
          (pl.short||pl.tight||pl.drop.length?
            '<div style="position:relative;margin-top:9px;padding:10px 11px;border-radius:var(--r);'+
              'background:rgba(255,178,107,.09);box-shadow:inset 0 0 0 1px rgba(255,178,107,.22);display:flex;gap:9px">'+
              '<i class="ph ph-warning-circle" style="font-size:15px;color:var(--warn);flex:none;margin-top:1px"></i>'+
              '<span style="font-size:11.5px;color:#ffd6a8;line-height:1.5">'+esc(crunchLine(pl))+'</span></div>':'')+
          '</div>';
      }).join('')+'</div>'+

      '<div style="padding:18px 20px 0"><button class="btn" data-act="plan:save">Save the week</button></div>'+
      '<div style="padding:10px 20px 0;font-size:11px;color:var(--n600);line-height:1.5;text-align:center">'+
        'A finish before the start is read as the next morning \u2014 so 16:00 to 01:30 works.</div>'+
      '</div></div>';
  }

  if(S.sheet){
    var dr=S.draft,sc=dr.diff==='Easy'?3:dr.diff==='Medium'?6:10,body='';
    if(S.sheet===1){
      body='<div style="font-size:20px;font-weight:600;letter-spacing:-.02em">Name the action</div>'+
      '<div style="margin-top:6px;font-size:12.5px;color:var(--n500);line-height:1.5">Write what you\u2019ll do, not what you '+
        'want. "Walk 20 minutes", not "get fit".</div>'+
      '<div class="field" style="margin-top:16px"><label>Habit</label>'+
        '<input class="inp" id="dname" placeholder="Walk 20 minutes" value="'+esc(dr.name)+'"></div>'+
      '<div class="kick" style="margin-top:16px">Category</div>'+
      '<div style="margin-top:9px;display:flex;flex-wrap:wrap;gap:7px">'+Object.keys(LIB).map(function(c){
        return '<button class="chip'+(dr.cat===c?' on':'')+'" style="padding:7px 11px;font-size:12px" data-act="d:cat:'+esc(c)+'">'+
        '<i class="'+CATICON[c]+'"></i>'+esc(c)+'</button>'}).join('')+'</div>'+
      '<div class="kick" style="margin-top:16px">Icon</div>'+
      '<div style="margin-top:9px;display:flex;flex-wrap:wrap;gap:7px">'+ICONS.map(function(ic,n){
        return '<button class="chip'+(dr.icon===ic?' on':'')+'" style="width:44px;height:44px;border-radius:12px" '+
        'data-act="d:icon:'+n+'"><i class="'+ic+'" style="font-size:17px"></i></button>'}).join('')+'</div>';
    } else if(S.sheet===2){
      body='<div style="font-size:20px;font-weight:600;letter-spacing:-.02em">Give it a slot</div>'+
      '<div style="margin-top:6px;font-size:12.5px;color:var(--n500);line-height:1.5">Pick the slot, not the mood.</div>'+
      '<div class="kick" style="margin-top:16px">Time of day</div>'+
      '<div style="margin-top:9px;display:flex;gap:7px">'+[['am','Morning','ph ph-sun-horizon'],['pm','Afternoon','ph ph-sun'],
        ['eve','Evening','ph ph-moon-stars'],['flex','Any time','ph ph-infinity']].map(function(p){
        return '<button class="chip'+(dr.part===p[0]?' on':'')+'" style="flex:1;padding:9px 2px;font-size:11.5px" '+
        'data-act="d:part:'+p[0]+'"><i class="'+p[2]+'"></i>'+p[1]+'</button>'}).join('')+'</div>'+
      '<div class="field" style="margin-top:16px"><label>Time on a normal day</label>'+
        '<input class="inp" id="dtime" type="time" value="'+esc(dr.time)+'"></div>';
    } else {
      body='<div style="font-size:20px;font-weight:600;letter-spacing:-.02em">Make it hard to skip</div>'+
      '<div style="margin-top:6px;font-size:12.5px;color:var(--n500);line-height:1.5">Stack it onto something you already do, '+
        'then shrink it to two minutes.</div>'+
      '<div class="field" style="margin-top:16px"><label>After I…</label>'+
        '<input class="inp" id="dstack" placeholder="get in from work" value="'+esc(dr.stack)+'"></div>'+
      '<div style="margin-top:10px;padding:12px 13px;border-radius:var(--r);background:var(--a900);box-shadow:0 0 0 1px var(--a800);'+
        'font-size:13px;color:var(--a100);line-height:1.45">After I '+esc(dr.stack||'…')+', I will '+
        esc(dr.name?dr.name.toLowerCase():'…')+'.</div>'+
      '<div class="field" style="margin-top:16px"><label>The two-minute version</label>'+
        '<input class="inp" id="dtiny" placeholder="put my trainers on" value="'+esc(dr.tiny)+'"></div>'+
      '<div class="kick" style="margin-top:16px">Weight</div>'+
      '<div style="margin-top:9px;display:flex;gap:7px">'+['Easy','Medium','Hard'].map(function(d){
        return '<button class="chip'+(dr.diff===d?' on':'')+'" style="flex:1" data-act="d:diff:'+d+'">'+d+'</button>'}).join('')+'</div>'+
      '<div style="margin-top:14px;display:flex;align-items:center;justify-content:space-between;padding:12px 13px;'+
        'border-radius:var(--r);background:#20222f;box-shadow:0 0 0 1px var(--line2)">'+
        '<span style="font-size:12.5px;color:var(--n500)">Adds to your daily score</span>'+
        '<span style="font-size:15px;font-weight:600;color:var(--a200)">+'+sc+'</span></div>';
    }
    out+='<div class="sheet"><div>'+
      '<div style="padding:16px 20px 0;display:flex;align-items:center;justify-content:space-between">'+
      '<span style="font-size:16px;font-weight:600">New habit</span>'+
      '<button data-act="sheet:close" style="width:36px;height:36px"><i class="ph ph-x" style="font-size:20px"></i></button></div>'+
      '<div style="padding:12px 20px 0;display:flex;gap:5px">'+[1,2,3].map(function(n){
        return '<div style="flex:1;height:3px;border-radius:999px;background:'+(n<=S.sheet?'var(--accent)':'#2f3240')+'"></div>'
      }).join('')+'</div>'+
      '<div style="padding:20px 20px 0">'+body+'</div>'+
      '<div style="padding:20px;display:flex;gap:9px">'+
      (S.sheet>1?'<button class="btn sec2" style="width:auto;padding:13px 18px" data-act="sheet:back">Back</button>':'')+
      '<button class="btn" data-act="sheet:next">'+(S.sheet===3?'Add to my day':'Continue')+'</button></div>'+
      '</div></div>';
  }
  return out;
}

/* ─────────── render ─────────── */
function planWid(){var m=new Date();m.setDate(m.getDate()-midx(m)+S.planWeek*7);return dkey(m)}
function planDays(){var w=planWid(),d=S.weeks[w]||DEFAULT_WEEK,o={};for(var k in d)o[k]=d[k];return o}
function setDay(i,v){var w=planWid(),d=planDays();d[i]=v;S.weeks[w]=d;clearPlans()}

var scrollPos={},lastOverKey='';
function render(){
  var C=compute();
  var sc=document.getElementById('scroll');
  var focusId=document.activeElement&&document.activeElement.id;
  var caret=null;
  if(focusId&&document.activeElement.selectionStart!==undefined)caret=document.activeElement.selectionStart;
  var locked=!!(S.sheet||S.routine||S.plan);
  var overKey=S.routine?'routine':S.plan?'plan':S.sheet?'sheet':'';
  var sameOverlay=(overKey===lastOverKey);
  sc.style.overflowY=locked?'hidden':'auto';
  if(!locked)scrollPos[S.tab]=sc.scrollTop;

  /* the page behind a locked overlay can't be seen \u2014 don't rebuild it every tick */
  if(!locked||!sameOverlay){
    var v=S.tab==='today'?viewToday(C):S.tab==='stats'?viewStats(C):S.tab==='cal'?viewCal(C):
          S.tab==='habits'?viewHabits(C):viewYou(C);
    document.getElementById('app').innerHTML=v;
    document.getElementById('tabs').innerHTML=[['today','Today','sun-horizon'],['stats','Progress','chart-line-up'],
      ['cal','Calendar','calendar-dots'],['habits','Habits','squares-four'],['you','You','user-circle']].map(function(t){
      var on=S.tab===t[0];
      return '<button class="tab'+(on?' on':'')+'" data-act="tab:'+t[0]+'"><i class="'+(on?'ph-fill':'ph')+' ph-'+t[2]+'"></i>'+t[1]+'</button>';
    }).join('');
  }

  var ov=document.getElementById('over');
  var pane=ov.querySelector('.sheet>div,.full');
  var keepScroll=(sameOverlay&&pane)?pane.scrollTop:0;
  ov.innerHTML=overlays(C);
  var pane2=ov.querySelector('.sheet>div,.full');
  if(pane2){
    if(sameOverlay){if(keepScroll)pane2.scrollTop=keepScroll}
    else pane2.className+=' in';
  }
  lastOverKey=overKey;
  if(focusId){var f=document.getElementById(focusId);
    if(f){f.focus();if(caret!==null&&f.setSelectionRange)try{f.setSelectionRange(caret,caret)}catch(e){}}}
}

/* ─────────── events ─────────── */
document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('[data-act]'):null;
  if(!t)return;
  var a=t.getAttribute('data-act'),p=a.split(':'),k=p[0];
  if(k==='tab'){S.tab=p[1];S.sel=null;
    setTimeout(function(){document.getElementById('scroll').scrollTop=scrollPos[S.tab]||0},0)}
  else if(k==='toggle'){
    var id=p[1],on=doneIds().indexOf(id)<0;mark(id,on);buzz();
    if(on){var h=habits().filter(function(x){return x.id===id})[0];if(h)ping(h.name,'+'+h.score)}}
  else if(k==='bump'){
    var h2=habits().filter(function(x){return x.id===p[1]})[0];
    var kk=today();if(!S.counts[kk])S.counts[kk]={};
    S.counts[kk][h2.id]=(S.counts[kk][h2.id]||0)+h2.step;
    if(S.counts[kk][h2.id]>=h2.target){mark(h2.id,true);ping(h2.name,'+'+h2.score)}
    else ping('Water logged',S.counts[kk][h2.id]+' ml');
    buzz();save()}
  else if(k==='timer'){
    var h3=habits().filter(function(x){return x.id===p[1]})[0];
    S.timer=(S.timer&&S.timer.id===h3.id)?null:{id:h3.id,end:Date.now()+h3.secs*1000};save()}
  else if(k==='sec'){var pp=p[1],cur=S.open[pp];
    var partNow=new Date().getHours()<12?'am':new Date().getHours()<18?'pm':'eve';
    S.open[pp]=cur===undefined?!(pp===partNow||pp==='flex'):!cur}
  else if(k==='mood'){S.mood[today()]=parseInt(p[1],10);save();buzz()}
  else if(k==='stay'){S.stay[today()]=p[1];save()}
  else if(k==='pack'){S.moved[p[1]]=S.stay[today()];save();
    var it=ITEMS.filter(function(x){return x.id===p[1]})[0];ping(it.name+' packed','');buzz()}
  else if(k==='move'){var it2=ITEMS.filter(function(x){return x.id===p[1]})[0];
    S.moved[p[1]]=placeOf(it2)==='home'?'gf':'home';save()}
  else if(k==='cal'){S.monthOff+=(p[1]==='prev'?-1:1);if(S.monthOff>0)S.monthOff=0;S.sel=null}
  else if(k==='day'){S.sel=p[1]}
  else if(k==='cat'){var cn=a.slice(4);S.libCat=S.libCat===cn?null:cn}
  else if(k==='lib'){
    var rest=a.slice(4),bits=rest.split('|'),cat=bits[0],nm=bits[1];
    var norm=nm.toLowerCase().replace(/\s*\(.*\)\s*$/,'');
    var seedHit=null;SEED.forEach(function(h){if(h.name.toLowerCase()===norm)seedHit=h});
    var activeNames=habits().map(function(h){return h.name.toLowerCase()});
    var on=libOn(activeNames,nm);
    if(on){ if(seedHit)S.off.push(seedHit.id);
      else S.extra=S.extra.filter(function(h){return h.name.toLowerCase()!==norm});
      ping(nm+' removed','')}
    else { if(seedHit)S.off=S.off.filter(function(x){return x!==seedHit.id});
      else S.extra.push({id:'l'+Date.now(),name:nm,cat:cat,icon:CATICON[cat]||'ph ph-circle',score:4,
        cue:'Pin this to something you already do.',tiny:'The smallest version.',at:'18:00'});
      ping(nm+' added','+4')}
    save()}
  else if(k==='plan'){
    if(p[1]==='open'){S.plan=true;S.planWeek=planned(wid(new Date()))&&!planned(nextWid())?1:0}
    else if(p[1]==='close')S.plan=false;
    else if(p[1]==='prev')S.planWeek=Math.max(0,S.planWeek-1);
    else if(p[1]==='next')S.planWeek=Math.min(8,S.planWeek+1);
    else if(p[1]==='save'){
      var m=new Date();m.setDate(m.getDate()-midx(m)+S.planWeek*7);
      var id2=dkey(m);S.weeks[id2]=weekDays(id2);S.plan=false;save();ping('Week rebuilt around your shifts','')}}
  else if(k==='sh'){
    var cur=normDay(planDays()[p[1]]);
    setDay(p[1],p[2]==='off'?'off':(cur.off?{s:540,e:1020}:cur));save()}
  else if(k==='pre'){
    var pr=null;PRESET.forEach(function(x){if(x[0]===p[2])pr=x});
    if(pr)setDay(p[1],{s:pr[2],e:pr[3]});save()}
  else if(k==='rest'){
    var src=planDays()[p[1]];
    for(var q3=+p[1]+1;q3<7;q3++)setDay(q3,src);
    save();ping('Copied to the rest of the week','')}
  else if(k==='cfg'){
    if(!S.cfg)S.cfg={};S.cfg[p[1]]=parseInt(p[2],10);save();ping('Times rebuilt','')}
  else if(k==='routine'){
    if(p[1]==='start')S.routine={i:0,at:Date.now(),kind:new Date().getHours()<12?'am':'eve'};
    else if(p[1]==='close')S.routine=null;
    else if(p[1]==='skip')S.routine.i++;
    else if(p[1]==='done'){
      var ids2=S.routine.kind==='am'?['wake','water1','brushAM','bed','breakfast','suppsAM']
        :['read','brushPM','castor','suppsPM','phone','prep','sleep'];
      var av=[];ids2.forEach(function(x){if(habits().some(function(h){return h.id===x}))av.push(x)});
      if(av[S.routine.i])mark(av[S.routine.i],true);
      S.routine.i++;buzz()}}
  else if(k==='sheet'){
    if(p[1]==='open'){S.sheet=1;S.draft={name:'',cat:'Back care',icon:ICONS[5],part:'eve',time:'19:00',stack:'',tiny:'',diff:'Medium'}}
    else if(p[1]==='close')S.sheet=0;
    else if(p[1]==='back')S.sheet--;
    else if(p[1]==='next'){
      if(S.sheet<3)S.sheet++;
      else{var d=S.draft,sc2=d.diff==='Easy'?3:d.diff==='Medium'?6:10;
        var nh={id:'c'+Date.now(),name:d.name||'New habit',cat:d.cat,icon:d.icon,score:sc2,
          cue:'After I '+(d.stack||'finish the last thing')+', I '+(d.name||'do it').toLowerCase()+'.',
          tiny:d.tiny||'The smallest version.'};
        if(d.part==='flex')nh.flex=1;else nh.at=d.time;
        S.extra.push(nh);S.sheet=0;S.tab='today';save();ping('Added to your day','+'+sc2)}}}
  else if(k==='d'){
    if(p[1]==='cat')S.draft.cat=a.slice(6);
    else if(p[1]==='icon')S.draft.icon=ICONS[parseInt(p[2],10)];
    else if(p[1]==='part')S.draft.part=p[2];
    else if(p[1]==='diff')S.draft.diff=p[2];}
  else if(k==='notif'){S.notifOn=!S.notifOn;save()}
  else if(k==='tone'){S.tone=p[1];save()}
  else if(k==='rem'){S.remOff=S.remOff.indexOf(p[1])<0?S.remOff.concat([p[1]]):S.remOff.filter(function(x){return x!==p[1]});save()}
  else if(k==='backup'){copyText(JSON.stringify(backupData()))}
  else if(k==='restore'){
    var raw=prompt('Paste a backup here. This replaces everything currently saved.');
    if(raw){var okj=null;try{okj=JSON.parse(raw)}catch(e){}
      if(okj&&typeof okj==='object'){apply(okj);save();ping('Backup restored','')}
      else ping('That didn\u2019t look like a backup','')}}
  else if(k==='resetday'){S.log[today()]=[];S.counts={};save();ping('Today reset','')}
  else if(k==='wipe'){
    if(confirm('Clear every habit tick, streak and setting?')){
      try{localStorage.removeItem(KEY)}catch(e){}
      S.log={};S.counts={};S.mood={};S.extra=[];S.off=[];S.remOff=[];S.weeks={};S.stay={};S.moved={};
      save();ping('All data cleared','')}}
  render();
},false);

function timeEdit(el){
  var m=/^s(s|e)(\d)$/.exec(el.id); if(!m||!el.value)return;
  var i=m[2],cur=normDay(planDays()[i]);
  var v=tmin(el.value);
  var nv=m[1]==='s'?{s:v,e:cur.off?1020:cur.e%1440}:{s:cur.off?540:cur.s,e:v};
  if(m[1]==='s'&&cur.off)nv.e=1020;
  setDay(i,nv);save();
}
document.addEventListener('change',function(e){
  if(/^s(s|e)\d$/.test(e.target.id)){timeEdit(e.target);render()}
},false);

document.addEventListener('input',function(e){
  var id=e.target.id;
  if(/^s(s|e)\d$/.test(id)){timeEdit(e.target);return}
  if(id==='q'){S.query=e.target.value;render()}
  else if(id==='dname'){S.draft.name=e.target.value}
  else if(id==='dtime'){S.draft.time=e.target.value}
  else if(id==='dstack'){S.draft.stack=e.target.value}
  else if(id==='dtiny'){S.draft.tiny=e.target.value}
},false);

var lastMin=new Date().getMinutes();
document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;
  if(!S.log[today()])S.log[today()]=[];
  lastMin=new Date().getMinutes();render();
},false);
setInterval(function(){
  if(S.timer){
    if(timerLeft()<=0){mark(S.timer.id,true);ping('Study block done','+10');S.timer=null;save();buzz()}
    render();return}
  if(S.routine){render();return}
  var m=new Date().getMinutes();
  if(m!==lastMin){lastMin=m;if(S.tab==='today')render()}
},1000);

load();
if(!S.log[today()])S.log[today()]=[];
render();
</script>
</body>
</html>
